yolo_node:
  ros__parameters:
    image_topic: /oak/rgb/image_raw
    model: yolo11n.pt
    confidence: 0.35
    device: "0"
    maximum_rate_hz: 15.0

yolo_udp_bridge_node:
  ros__parameters:
    bind_address: "127.0.0.1"
    port: 5005
    receive_rate_hz: 50.0
    detection_timeout_s: 0.35
    lidar_timeout_s: 0.35
    lidar_front_half_angle_deg: 12.0
    person_confidence: 0.45
    person_center_min_ratio: 0.20
    person_center_max_ratio: 0.80
    person_minimum_height_ratio: 0.12
